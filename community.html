<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080811">
  <meta name="description" content="Sign in to access Jeron World.">
  <title>Sign In | Jeron World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261104c">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=20261104d" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="community.html"><span class="brand-mark">JW</span><span>JERON <b>WORLD</b></span></a>
  </header>
  <main class="signin-main">
    <section class="signin-card">
      <div class="signin-mark">JW</div>
      <p class="eyebrow">PRIVATE MEMBER ACCESS</p>
      <h1>Welcome to<br><span>Jeron World.</span></h1>
      <p class="signin-intro">Sign in or create your free account to enter the entertainment universe.</p>
      <form id="authForm" class="stack-form">
        <label for="authEmail">Email address</label>
        <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email" required>
        <label for="authPassword">Password</label>
        <input id="authPassword" type="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required>
        <button type="submit">Enter Jeron World ↗</button>
      </form>
      <div id="authStatus" class="form-status" aria-live="polite">Sign in or create an account to continue.</div>
      <button id="signOutBtn" class="ghost-button hidden" type="button">Sign out</button>
      <p class="signin-note">New here? Enter your email and choose a password to create your account.</p>
    </section>
  </main>
</body>
</html>
