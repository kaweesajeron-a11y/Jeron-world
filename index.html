<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeron World | Music, Movies & Culture</title>
    <style>
        /* --- PREMIUM DARK THEMING & VARIABLES --- */
        :root {
            --bg-main: #0b0c10;
            --bg-card: #1f2833;
            --text-primary: #c5a059;
            --text-body: #ffffff;
            --text-muted: #c5c6c7;
            --accent: #ff4a5a;
            --accent-hover: #e03e4d;
            --font-display: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-body);
            font-family: var(--font-display);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* --- GLOBAL UTILITIES --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-padding {
            padding: 80px 0;
        }

        .section-title {
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* --- NAVIGATION BAR --- */
        header {
            background-color: rgba(11, 12, 16, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* --- HERO SECTION --- */
        .hero {
            background: linear-gradient(180px, rgba(11,12,16,0.2) 0%, rgba(11,12,16,1) 100%), 
                        url('https://unsplash.com') no-repeat center center/cover;
            height: 80vh;
            display: flex;
            align-items: center;
            text-align: center;
        }

        .hero-content h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .hero-content p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 40px auto;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            border: 2px solid var(--text-muted);
        }

        .btn-secondary:hover {
            background-color: #fff;
            color: var(--bg-main);
            transform: translateY(-2px);
        }

        /* --- MARQUEE / TICKER --- */
        .ticker-wrap {
            background: var(--accent);
            overflow: hidden;
            padding: 15px 0;
            white-space: nowrap;
        }

        .ticker-content {
            display: inline-block;
            animation: marquee 25s linear infinite;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.1rem;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* --- SEARCH INTEGRATION --- */
        .search-wrapper {
            margin-bottom: 40px;
            position: relative;
        }

        .search-wrapper input {
            width: 100%;
            padding: 18px 25px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: var(--bg-card);
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-wrapper input:focus {
            border-color: var(--text-primary);
        }

        /* --- CONTENT CARDS GRID --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .search-item {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .search-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .card-img-wrapper {
            position: relative;
            padding-top: 130%; /* Unified poster/cover aspect ratio */
            overflow: hidden;
            background-color: #111;
        }

        .card-img-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .search-item:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .card-body h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .card-body p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .card-link {
            font-weight: 600;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .card-link:hover {
            color: #fff;
        }

        /* --- ABOUT & BIOGRAPHY --- */
        .about-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 5px;
            align-items: center;
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            min-height: 400px;
            object-fit: cover;
        }

        .about-text {
            padding: 50px;
        }

        .about-text h3 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #fff;
        }

        /* --- CONTACT & SOCIAL FOOTER --- */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .social-btn:hover {
            background: var(--text-primary);
            color: var(--bg-main);
            transform: scale(1.05);
        }

        footer {
            background: #050508;
            padding: 40px 0;
            text-align: center;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-width: 900px) {
            .about-layout { grid-template-columns: 1fr; }
            .hero-content h1 { font-size: 2.8rem; }
            .nav-links { display: none; } /* Simplified for structural robustness */
        }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <header>
        <div class="container nav-container">
            <div class="logo">JW JERON WORLD</div>
            <ul class="nav-links">
                <li><a href="#explore">Explore</a></li>
                <li><a href="#anime">Anime</a></li>
                <li><a href="#music">Music</a></li>
                <li><a href="#movies">Movies</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#connect">Connect</a></li>
            </ul>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="container hero-content">
